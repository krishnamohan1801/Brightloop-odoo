spring.application.name=brightloop-part3-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/brightloop}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# The shared schema is managed separately. This module must never create or alter tables.
spring.sql.init.mode=never
spring.jackson.serialization.write-dates-as-timestamps=false

# Daily billing check at 01:00 server time. Change with BRIGHTLOOP_BILLING_CRON if required.
brightloop.billing.enabled=${BRIGHTLOOP_BILLING_ENABLED:true}
brightloop.billing.cron=${BRIGHTLOOP_BILLING_CRON:0 0 1 * * *}

springdoc.swagger-ui.path=/swagger-ui.html
logging.level.com.brightloop.billing=INFO
