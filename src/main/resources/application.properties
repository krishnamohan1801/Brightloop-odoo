spring.application.name=brightloop-authentication
server.port=8080

# Import local development properties if present (git-ignored)
spring.config.import=optional:classpath:application-local.properties

# =====================================================
# DATABASE - Configured via Environment Variables
# =====================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/brightloop}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Automatically initialize schema on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# =====================================================
# EMAIL (SMTP) - Gmail Configuration
# =====================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =====================================================
# JWT Configuration
# =====================================================
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:REPLACE_WITH_BASE64_SECRET_AT_LEAST_32_BYTES}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# =====================================================
# Bootstrap Admin - Auto-create first admin on startup
# =====================================================
app.bootstrap-admin.name=${BRIGHTLOOP_ADMIN_NAME:Brightloop Admin}
app.bootstrap-admin.email=${BRIGHTLOOP_ADMIN_EMAIL:admin@brightloop.com}
app.bootstrap-admin.password=${BRIGHTLOOP_ADMIN_PASSWORD:}